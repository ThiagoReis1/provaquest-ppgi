services:
  provaquest:
    build:
      context: .
      dockerfile: Dockerfile
    image: provaquest-ppgi:local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MANUS_API_URL: ${MANUS_API_URL:-}
      MANUS_API_KEY: ${MANUS_API_KEY:-}
    restart: unless-stopped
